<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kabir Emporium - Customer Directory</title>
    <style>
        :root {
            --primary: #007aff;
            --primary-dark: #0056b3;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --border-color: #e5e5ea;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }

        .header-banner {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
        }

        .header-banner h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-banner p {
            font-size: 13px;
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        input, button {
            font-size: 15px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            outline: none;
        }

        input {
            background: var(--card-bg);
            flex: 1;
            min-width: 140px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: var(--primary-dark);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .customer-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .customer-item:last-child {
            border-bottom: none;
        }

        .customer-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .customer-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .customer-amount {
            text-align: right;
        }

        .customer-amount .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .customer-amount .details {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-bar {
            font-size: 13px;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>Kabir Emporium</h1>
        <p>Customer Directory & Auto-Sync</p>
    </div>

    <!-- Status & Auto-Sync Indicator -->
    <div class="status-bar">
        <span id="syncStatus">Ready</span>
        <button onclick="manualSyncNow()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600; font-size: 13px;">Force Sync 🔄</button>
    </div>

    <!-- Add Customer Card -->
    <div class="card">
        <h2 style="font-size: 17px; margin-bottom: 12px;">Add New Customer</h2>
        <div class="form-grid full">
            <input type="text" id="custName" placeholder="Customer Name">
        </div>
        <div class="form-grid">
            <input type="text" id="custCity" placeholder="City">
            <input type="text" id="custDate" placeholder="DD/MM/YYYY">
        </div>
        <div class="form-grid">
            <input type="number" id="itemCount" placeholder="Item Count" value="1">
            <input type="number" id="itemPrice" placeholder="Price (₹)">
        </div>
        <button class="btn" style="width: 100%; margin-top: 4px;" onclick="addCustomer()">Add Customer & Save</button>
    </div>

    <!-- Search & List Card -->
    <div class="card">
        <div class="toolbar" style="margin-bottom: 12px;">
            <input type="text" id="searchInput" placeholder="Search by name or city..." oninput="renderTable()">
        </div>
        <div id="customerList">
            <!-- Dynamic items rendered here -->
        </div>
    </div>

    <script>
        let customers = [];
        let syncTimeout = null;

        // Load data on startup
        window.addEventListener('DOMContentLoaded', async () => {
            await loadFromGitHubStartup();
            document.getElementById('custDate').value = getFormattedDate(new Date());
        });

        function getFormattedDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Fetch latest backup from GitHub repository on startup
        async function loadFromGitHubStartup() {
            const rawUrl = "https://raw.githubusercontent.com/playtv02/Customer-directory/main/kabir_emporium_backup.json";
            const statusEl = document.getElementById('syncStatus');
            
            try {
                statusEl.innerText = "Checking updates...";
                const res = await fetch(rawUrl + "?t=" + new Date().getTime());
                if (res.ok) {
                    const backupData = await res.json();
                    if (Array.isArray(backupData)) {
                        customers = backupData;
                        localStorage.setItem('kabir_customers', JSON.stringify(customers));
                        renderTable();
                    }
                }
                statusEl.innerText = "✅ Up to date";
            } catch (e) {
                const local = localStorage.getItem('kabir_customers');
                if (local) {
                    customers = JSON.parse(local);
                    renderTable();
                }
                statusEl.innerText = "📴 Offline mode";
            }
        }

        // Add Customer
        function addCustomer() {
            const name = document.getElementById('custName').value.trim();
            const city = document.getElementById('custCity').value.trim();
            const date = document.getElementById('custDate').value.trim() || getFormattedDate(new Date());
            const count = parseInt(document.getElementById('itemCount').value) || 1;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;

            if (!name) {
                alert("Please enter customer name.");
                return;
            }

            const newEntry = {
                id: Date.now().toString(),
                name,
                city,
                date,
                count,
                price,
                total: count * price
            };

            customers.unshift(newEntry);
            saveDataAndAutoSync();

            document.getElementById('custName').value = '';
            document.getElementById('custCity').value = '';
            document.getElementById('itemCount').value = '1';
            document.getElementById('itemPrice').value = '';
        }

        // Delete Customer
        function deleteCustomer(id) {
            if (confirm("Delete this customer record?")) {
                customers = customers.filter(c => c.id !== id);
                saveDataAndAutoSync();
            }
        }

        // Render Customer List
        function renderTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('customerList');
            
            const filtered = customers.filter(c => 
                c.name.toLowerCase().includes(query) || (c.city && c.city.toLowerCase().includes(query))
            );

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align: center; color: var(--text-secondary); padding: 20px 0;">No customers found.</p>`;
                return;
            }

            listEl.innerHTML = filtered.map(c => `
                <div class="customer-item">
                    <div class="customer-info">
                        <h3>${escapeHtml(c.name)}</h3>
                        <p>${escapeHtml(c.city || 'N/A')} • ${c.date}</p>
                    </div>
                    <div class="customer-amount">
                        <div class="price">₹${(c.total || (c.count * c.price)).toLocaleString()}</div>
                        <div class="details">${c.count} items @ ₹${c.price}</div>
                        <button onclick="deleteCustomer('${c.id}')" style="background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer; margin-top:4px;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Centralized Save & Background Auto-Sync
        function saveDataAndAutoSync() {
            localStorage.setItem('kabir_customers', JSON.stringify(customers));
            renderTable();

            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "⏳ Saving changes...";
            statusEl.style.color = "#d97706";

            if (syncTimeout) clearTimeout(syncTimeout);

            syncTimeout = setTimeout(async () => {
                try {
                    await pushToGitHubSilent(JSON.stringify(customers));
                    statusEl.innerText = "☁️ Synced to GitHub";
                    statusEl.style.color = "#16a34a";
                } catch (err) {
                    console.error(err);
                    statusEl.innerText = "⚠️ Sync failed (Check PAT token)";
                    statusEl.style.color = "#dc2626";
                }
            }, 2000);
        }

        async function manualSyncNow() {
            try {
                document.getElementById('syncStatus').innerText = "Syncing now...";
                await pushToGitHubSilent(JSON.stringify(customers));
                document.getElementById('syncStatus').innerText = "☁️ Synced to GitHub!";
            } catch (e) {
                alert("Sync failed: " + e.message);
            }
        }

        // Background GitHub API Pusher
        async function pushToGitHubSilent(jsonDataString) {
            const owner = "playtv02";
            const repo = "Customer-directory";
            const path = "kabir_emporium_backup.json";
            
            let token = localStorage.getItem("github_pat");
            if (!token) {
                token = prompt("Enter your GitHub Personal Access Token (required once for cross-device sync):");
                if (!token) throw new Error("Token missing");
                localStorage.setItem("github_pat", token.trim());
            }

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

            const getRes = await fetch(url, {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github+json"
                }
            });
            
            let sha = null;
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }

            const contentBase64 = btoa(unescape(encodeURIComponent(jsonDataString)));

            const putRes = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json",
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({
                    message: "Auto-sync customer directory update",
                    content: contentBase64,
                    sha: sha
                })
            });

            if (!putRes.ok) {
                const errJson = await putRes.json();
                if (putRes.status === 401 || putRes.status === 403) {
                    localStorage.removeItem("github_pat");
                }
                throw new Error(errJson.message || "API push failed");
            }
        }
    </script>
</body>
</html>
