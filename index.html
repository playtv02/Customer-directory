<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customer directory for Kabir Emporium">
    <title>Kabir Emporium Directory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f7f9;
            --surface: #ffffff;
            --surface-hover: #f4f4f5;
            --text-main: #111113;
            --text-muted: #71717a;
            --border: #e4e4e7;
            --accent: #000000;
            --focus-ring: rgba(0, 0, 0, 0.15);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --surface: #18181b;
                --surface-hover: #27272a;
                --text-main: #fafafa;
                --text-muted: #a1a1aa;
                --border: #27272a;
                --accent: #fafafa;
                --focus-ring: rgba(250, 250, 250, 0.2);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text-main);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .required-mark {
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kabir Emporium Directory</h1>
        
        <form id="customerForm">
            <!-- Name (Compulsory) -->
            <div class="form-group">
                <label for="name">Name <span class="required-mark">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Enter customer name">
            </div>

            <!-- Price (Compulsory) -->
            <div class="form-group">
                <label for="price">Price <span class="required-mark">*</span></label>
                <input type="number" id="price" name="price" required min="0" step="0.01" placeholder="Enter price">
            </div>

            <!-- City (Compulsory) -->
            <div class="form-group">
                <label for="city">City <span class="required-mark">*</span></label>
                <input type="text" id="city" name="city" required placeholder="Enter city">
            </div>

            <button type="submit">Save Entry</button>
        </form>
    </div>

    <script>
        document.getElementById('customerForm').addEventListener('submit', function(event) {
            const name = document.getElementById('name').value.trim();
            const price = document.getElementById('price').value.trim();
            const city = document.getElementById('city').value.trim();

            if (!name || !price || !city) {
                event.preventDefault();
                alert('Name, Price, and City are compulsory entries!');
                return;
            }
            
            // Add your further submission handling logic here
        });
    </script>
</body>
</html>
