<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer directory for Kabir Emporium">
  <title>Kabir Emporium Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Neumorphic Soft-UI Base Palette */
      --neu-bg: #e0e5ec;
      --neu-surface: linear-gradient(145deg, #f0f5fc, #caced4);
      --neu-concave: linear-gradient(145deg, #caced4, #f0f5fc);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-grad: linear-gradient(145deg, #3b82f6, #1d4ed8);
      --danger: #ef4444;
      --danger-grad: linear-gradient(145deg, #f87171, #dc2626);
      --success: #10b981;
      --warning: #f59e0b;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;

      /* Neumorphic 3D Extruded & Carved Shadows */
      --neu-raised: 
        9px 9px 18px #a3b1c6,
        -9px -9px 18px #ffffff;

      --neu-raised-sm: 
        5px 5px 10px #a3b1c6,
        -5px -5px 10px #ffffff;

      --neu-pressed: 
        inset 6px 6px 12px #a3b1c6,
        inset -6px -6px 12px #ffffff;

      --neu-pressed-sm: 
        inset 3px 3px 7px #a3b1c6,
        inset -3px -3px 7px #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--neu-bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 64px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Neumorphic Header */
    .header-card {
      background: var(--neu-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--neu-raised);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 22px 26px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: var(--neu-bg);
      box-shadow: var(--neu-pressed-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Carved Sync Pill */
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--neu-bg);
      color: var(--text-muted);
      box-shadow: var(--neu-pressed-sm);
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text-muted);
      box-shadow: 0 0 6px rgba(0,0,0,0.15);
    }

    .sync-badge.ok .sync-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    .sync-badge.syncing .sync-dot {
      background: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      animation: pulse 1s infinite;
    }
    .sync-badge.error .sync-dot {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Neumorphic 3D Buttons */
    .btn {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-sm);
      padding: 11px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.15s ease;
      user-select: none;
      background: var(--neu-surface);
      color: var(--text-main);
      box-shadow: var(--neu-raised-sm);
    }

    .btn:hover {
      transform: translateY(-1px);
      color: var(--accent);
    }

    .btn:active {
      transform: translateY(1px);
      background: var(--neu-bg);
      box-shadow: var(--neu-pressed-sm);
    }

    .btn-primary {
      background: var(--accent-grad);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 
        5px 5px 12px #a3b1c6,
        -5px -5px 12px #ffffff,
        inset 1px 1px 2px rgba(255, 255, 255, 0.4);
    }

    .btn-primary:hover {
      color: #ffffff;
      filter: brightness(1.06);
    }

    .btn-primary:active {
      background: var(--accent);
      box-shadow: inset 4px 4px 8px rgba(15, 23, 42, 0.35);
    }

    .btn-secondary {
      background: var(--neu-surface);
      color: var(--text-main);
    }

    .btn-danger {
      background: var(--danger-grad);
      color: #ffffff;
      border: none;
      box-shadow: var(--neu-raised-sm);
      padding: 8px 13px;
      font-size: 0.82rem;
    }

    .btn-danger:hover {
      color: #ffffff;
      filter: brightness(1.06);
    }

    .btn-danger:active {
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.8rem;
      border-radius: 12px;
    }

    /* Neumorphic Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .stat-box {
      background: var(--neu-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--neu-raised);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 1px 1px 0px #ffffff;
    }

    /* Neumorphic Main Cards */
    .card {
      background: var(--neu-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--neu-raised);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 26px;
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-left: 4px;
    }

    /* Carved / Inset Neumorphic Inputs */
    .input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: var(--neu-bg);
      box-shadow: var(--neu-pressed);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .input::placeholder {
      color: #8c9bae;
      font-weight: 500;
    }

    .input:focus {
      border-color: rgba(37, 99, 235, 0.5);
      box-shadow: 
        var(--neu-pressed),
        0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Directory List & Carved Search */
    .search-bar {
      margin-bottom: 20px;
    }

    .customer-list {
      display: grid;
      gap: 16px;
    }

    .customer-item {
      background: var(--neu-bg);
      border-radius: var(--radius-md);
      box-shadow: var(--neu-raised-sm);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .customer-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--neu-raised);
    }

    .customer-info h3 {
      font-size: 1.04rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .customer-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge {
      padding: 5px 11px;
      border-radius: 10px;
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--neu-bg);
      box-shadow: var(--neu-pressed-sm);
      color: var(--text-main);
    }

    .badge-amount {
      color: var(--accent);
      font-weight: 800;
    }

    .customer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 38px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--neu-pressed);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Neumorphic Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(224, 229, 236, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--neu-bg);
      border-radius: var(--radius-lg);
      box-shadow: 
        14px 14px 28px #9aa7b8,
        -14px -14px 28px #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 460px;
      padding: 26px;
    }

    /* Neumorphic Floating Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--neu-bg);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 0.86rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 
        8px 8px 18px #9aa7b8,
        -8px -8px 18px #ffffff;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .header-card, .card {
        padding: 18px;
      }
      .customer-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .customer-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Neumorphic Header -->
    <header class="header-card">
      <div class="brand">
        <div class="brand-icon">📘</div>
        <div>
          <h1>Kabir Emporium Directory</h1>
          <p>Customer & Sales Cloud Directory</p>
        </div>
      </div>

      <div class="header-actions">
        <div id="syncBadge" class="sync-badge">
          <span class="sync-dot"></span>
          <span id="syncText">Local Mode</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="fetchFromGitHub(true)">🔄 Refresh</button>
        <button class="btn btn-secondary btn-sm" onclick="openSettings()">⚙️ GitHub Sync</button>
      </div>
    </header>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Total Entries</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Amount</div>
        <div class="stat-value" id="statAmount">₹0</div>
      </div>
    </div>

    <!-- Add / Edit Entry Form -->
    <section class="card">
      <div class="card-title">
        <span id="formTitle">➕ Add Customer Entry</span>
        <button id="cancelEditBtn" class="btn btn-secondary btn-sm" style="display:none;" onclick="resetForm()">Cancel Edit</button>
      </div>

      <form id="entryForm" onsubmit="handleSaveEntry(event)">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="input-group">
            <label for="custName">Customer Name *</label>
            <input type="text" id="custName" class="input" placeholder="Enter full name" required>
          </div>
          <div class="input-group">
            <label for="custPhone">Mobile Number *</label>
            <input type="tel" id="custPhone" class="input" placeholder="10-digit mobile" required>
          </div>
          <div class="input-group">
            <label for="custCity">City / Village</label>
            <input type="text" id="custCity" class="input" placeholder="e.g., Tarapur">
          </div>
          <div class="input-group">
            <label for="custAmount">Amount (₹)</label>
            <input type="number" step="any" id="custAmount" class="input" placeholder="0">
          </div>
          <div class="input-group">
            <label for="custNotes">Item / Notes</label>
            <input type="text" id="custNotes" class="input" placeholder="Bill no, payment mode, items">
          </div>
          <div class="input-group">
            <label for="custDate">Date</label>
            <input type="date" id="custDate" class="input">
          </div>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary">💾 Save Entry</button>
      </form>
    </section>

    <!-- Directory List -->
    <section class="card">
      <div class="card-title">
        <span>📋 Customer Records</span>
        <button class="btn btn-secondary btn-sm" onclick="exportJSON()">⬇️ Backup JSON</button>
      </div>

      <div class="search-bar">
        <input type="search" id="searchInput" class="input" placeholder="🔍 Search by name, phone, city, or notes..." oninput="renderList()">
      </div>

      <div id="customerList" class="customer-list"></div>
    </section>
  </div>

  <!-- GitHub Settings Modal -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-title">
        <span>⚙️ GitHub Cloud Sync (data.json)</span>
        <button class="btn btn-secondary btn-sm" onclick="closeSettings()">✕</button>
      </div>
      <div class="input-group" style="margin-bottom:14px;">
        <label>GitHub Owner / Username</label>
        <input type="text" id="ghOwner" class="input" value="playtv02">
      </div>
      <div class="input-group" style="margin-bottom:14px;">
        <label>Repository Name</label>
        <input type="text" id="ghRepo" class="input" value="Customer-directory">
      </div>
      <div class="input-group" style="margin-bottom:14px;">
        <label>File Path</label>
        <input type="text" id="ghPath" class="input" value="data.json">
      </div>
      <div class="input-group" style="margin-bottom:20px;">
        <label>GitHub Personal Access Token (repo scope)</label>
        <input type="password" id="ghToken" class="input" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div style="display:flex; gap:12px; justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
        <button class="btn btn-primary" onclick="saveSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- External Script -->
  <script src="script.js"></script>
</body>
</html>
