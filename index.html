<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer directory for Kabir Emporium">
  <title>Kabir Emporium Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-grad: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #cbd5e1 100%);
      --surface-3d: linear-gradient(145deg, #ffffff, #f8fafc);
      --surface-hover-3d: linear-gradient(145deg, #ffffff, #f1f5f9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-highlight: rgba(255, 255, 255, 0.9);
      --border-shadow: rgba(203, 213, 225, 0.5);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-depth: #1e3a8a;
      --danger: #ef4444;
      --danger-depth: #991b1b;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 20px;
      --focus-ring: rgba(37, 99, 235, 0.25);

      /* 3D Shadows */
      --shadow-3d: 
        8px 12px 20px rgba(15, 23, 42, 0.08),
        -4px -4px 12px rgba(255, 255, 255, 0.8),
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 4px rgba(203, 213, 225, 0.4);

      --shadow-inset: 
        inset 4px 4px 8px rgba(15, 23, 42, 0.06),
        inset -4px -4px 8px rgba(255, 255, 255, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header & Sync Bar */
    .header-card {
      background: var(--surface-3d);
      border-radius: var(--radius);
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 2rem;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-muted);
      box-shadow: var(--shadow-inset);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .sync-badge.ok .sync-dot { background: var(--success); }
    .sync-badge.syncing .sync-dot { background: var(--warning); animation: pulse 1s infinite; }
    .sync-badge.error .sync-dot { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 3D Buttons */
    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
      user-select: none;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 0 var(--accent-depth), 0 6px 12px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-3d);
      color: var(--text-main);
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 3px 0 var(--danger-depth), 0 4px 10px rgba(239, 68, 68, 0.22);
      padding: 7px 12px;
      font-size: 0.8rem;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    /* Cards & Forms */
    .card {
      background: var(--surface-3d);
      border-radius: var(--radius);
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      padding: 22px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-shadow);
      background: #f8fafc;
      box-shadow: var(--shadow-inset);
      color: var(--text-main);
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: var(--shadow-inset), 0 0 0 3px var(--focus-ring);
      background: #fff;
    }

    /* Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: var(--surface-3d);
      border-radius: 16px;
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      padding: 14px 18px;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-main);
    }

    /* Customer List */
    .search-bar {
      margin-bottom: 16px;
    }

    .customer-list {
      display: grid;
      gap: 12px;
    }

    .customer-item {
      background: var(--surface-3d);
      border-radius: 16px;
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s ease;
    }

    .customer-item:hover {
      background: var(--surface-hover-3d);
    }

    .customer-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .customer-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.83rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--text-main);
    }

    .badge-amount {
      background: rgba(37, 99, 235, 0.1);
      color: var(--accent);
    }

    .customer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Modal for GitHub Settings */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface-3d);
      border-radius: var(--radius);
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text-main);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header class="header-card">
      <div class="brand">
        <span class="brand-icon">📘</span>
        <div>
          <h1>Kabir Emporium Directory</h1>
          <p>Customer & Sales Cloud Directory</p>
        </div>
      </div>

      <div class="header-actions">
        <div id="syncBadge" class="sync-badge">
          <span class="sync-dot"></span>
          <span id="syncText">Local Mode</span>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="fetchFromGitHub(true)">🔄 Refresh</button>
        <button class="btn btn-secondary btn-sm" onclick="openSettings()">⚙️ GitHub Sync</button>
      </div>
    </header>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Total Entries</div>
        <div class="stat-value" id="statCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Amount</div>
        <div class="stat-value" id="statAmount">₹0</div>
      </div>
    </div>

    <!-- Add / Edit Entry Form -->
    <section class="card">
      <div class="card-title">
        <span id="formTitle">➕ Add Customer Entry</span>
        <button id="cancelEditBtn" class="btn btn-secondary btn-sm" style="display:none;" onclick="resetForm()">Cancel Edit</button>
      </div>

      <form id="entryForm" onsubmit="handleSaveEntry(event)">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="input-group">
            <label for="custName">Customer Name *</label>
            <input type="text" id="custName" class="input" placeholder="Enter full name" required>
          </div>
          <div class="input-group">
            <label for="custPhone">Mobile Number *</label>
            <input type="tel" id="custPhone" class="input" placeholder="10-digit mobile" required>
          </div>
          <div class="input-group">
            <label for="custCity">City / Village</label>
            <input type="text" id="custCity" class="input" placeholder="e.g., Tarapur">
          </div>
          <div class="input-group">
            <label for="custAmount">Amount (₹)</label>
            <input type="number" step="any" id="custAmount" class="input" placeholder="0">
          </div>
          <div class="input-group">
            <label for="custNotes">Item / Notes</label>
            <input type="text" id="custNotes" class="input" placeholder="Bill no, payment mode, items">
          </div>
          <div class="input-group">
            <label for="custDate">Date</label>
            <input type="date" id="custDate" class="input">
          </div>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary">💾 Save Entry</button>
      </form>
    </section>

    <!-- Directory List -->
    <section class="card">
      <div class="card-title">
        <span>📋 Customer Records</span>
        <button class="btn btn-secondary btn-sm" onclick="exportJSON()">⬇️ Backup JSON</button>
      </div>

      <div class="search-bar">
        <input type="search" id="searchInput" class="input" placeholder="🔍 Search by name, phone, city, or notes..." oninput="renderList()">
      </div>

      <div id="customerList" class="customer-list"></div>
    </section>
  </div>

  <!-- GitHub Settings Modal -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-title">
        <span>⚙️ GitHub Cloud Sync (`data.json`)</span>
        <button class="btn btn-secondary btn-sm" onclick="closeSettings()">✕</button>
      </div>
      <div class="input-group" style="margin-bottom:12px;">
        <label>GitHub Owner / Username</label>
        <input type="text" id="ghOwner" class="input" value="playtv02">
      </div>
      <div class="input-group" style="margin-bottom:12px;">
        <label>Repository Name</label>
        <input type="text" id="ghRepo" class="input" value="Customer-directory">
      </div>
      <div class="input-group" style="margin-bottom:12px;">
        <label>File Path</label>
        <input type="text" id="ghPath" class="input" value="data.json">
      </div>
      <div class="input-group" style="margin-bottom:18px;">
        <label>GitHub Personal Access Token (repo scope)</label>
        <input type="password" id="ghToken" class="input" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
        <button class="btn btn-primary" onclick="saveSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // --- STATE & STORAGE ---
    const STORAGE_KEY = 'kabir_emporium_customers_v1';
    const GH_CONFIG_KEY = 'kabir_emporium_gh_config';

    let entries = [];
    let isSaving = false;
    let pendingSave = false;

    // Default Today's Date
    document.getElementById('custDate').valueAsDate = new Date();

    function getGHConfig() {
      const saved = JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || '{}');
      // Fallback compatibility with older token keys if already saved in browser
      const legacyToken = localStorage.getItem('github_token') || localStorage.getItem('gh_token') || localStorage.getItem('token') || '';
      return {
        owner: (saved.owner || 'playtv02').trim(),
        repo: (saved.repo || 'Customer-directory').trim(),
        path: (saved.path || 'data.json').trim(),
        token: (saved.token || legacyToken).trim()
      };
    }

    // --- SAFE UTF-8 BASE64 ENCODER / DECODER (Prevents btoa crashes on Hindi/Gujarati/Emojis) ---
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function base64ToUtf8(base64) {
      const clean = base64.replace(/\s/g, '');
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    // --- UI HELPERS ---
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function setSyncStatus(state, text) {
      const badge = document.getElementById('syncBadge');
      const label = document.getElementById('syncText');
      badge.className = 'sync-badge ' + state;
      label.textContent = text;
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    // --- LOAD DATA FROM GITHUB OR LOCAL ---
    async function fetchFromGitHub(manual = false) {
      const cfg = getGHConfig();
      const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?t=${Date.now()}`;

      setSyncStatus('syncing', 'Loading data.json...');

      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (cfg.token) headers['Authorization'] = `Bearer ${cfg.token}`;

        const res = await fetch(apiUrl, { headers, cache: 'no-store' });

        if (res.status === 404) {
          // data.json doesn't exist yet; start empty and create on first save
          setSyncStatus('ok', 'Ready (New data.json)');
          return;
        }

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const fileData = await res.json();
        const decodedText = base64ToUtf8(fileData.content || 'W10=');
        const parsed = JSON.parse(decodedText);

        if (Array.isArray(parsed)) {
          entries = parsed;
        } else if (parsed && Array.isArray(parsed.customers)) {
          entries = parsed.customers;
        } else if (parsed && Array.isArray(parsed.entries)) {
          entries = parsed.entries;
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        renderList();
        setSyncStatus('ok', cfg.token ? 'Synced with data.json' : 'Read-Only (Add Token to Save)');
        if (manual) showToast('Loaded latest data.json from GitHub');
      } catch (err) {
        console.warn('GitHub fetch fallback:', err);
        setSyncStatus('error', 'Offline / Local Cache');
        if (manual) showToast('Could not fetch from GitHub: ' + err.message);
      }
    }

    // --- RELIABLE SAVE TO GITHUB WITH FRESH SHA & AUTO-RETRY ---
    async function syncToGitHub(retryCount = 0) {
      const cfg = getGHConfig();
      if (!cfg.token) {
        setSyncStatus('error', 'Saved Locally (No Token)');
        showToast('Saved locally. Add GitHub Token in ⚙️ to update data.json');
        return;
      }

      if (isSaving) {
        pendingSave = true;
        return;
      }

      isSaving = true;
      setSyncStatus('syncing', 'Saving to data.json...');

      const baseApiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
      const headers = {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': `Bearer ${cfg.token}`,
        'Content-Type': 'application/json'
      };

      try {
        // STEP 1: Always fetch the latest SHA with cache busting right before PUT
        let latestSha = null;
        const getRes = await fetch(`${baseApiUrl}?t=${Date.now()}`, {
          method: 'GET',
          headers,
          cache: 'no-store'
        });

        if (getRes.ok) {
          const getJson = await getRes.json();
          latestSha = getJson.sha;
        } else if (getRes.status !== 404) {
          const errJson = await getRes.json().catch(() => ({}));
          throw new Error(errJson.message || `Failed to read SHA (${getRes.status})`);
        }

        // STEP 2: Encode JSON safely and PUT to GitHub
        const contentStr = JSON.stringify(entries, null, 2);
        const bodyPayload = {
          message: `Update ${cfg.path} (${new Date().toLocaleString('en-IN')})`,
          content: utf8ToBase64(contentStr)
        };
        if (latestSha) {
          bodyPayload.sha = latestSha;
        }

        const putRes = await fetch(baseApiUrl, {
          method: 'PUT',
          headers,
          body: JSON.stringify(bodyPayload)
        });

        // STEP 3: Auto-retry if 409 Conflict or 422 SHA mismatch happens
        if ((putRes.status === 409 || putRes.status === 422) && retryCount < 3) {
          isSaving = false;
          await new Promise(r => setTimeout(r, 600 * (retryCount + 1)));
          return syncToGitHub(retryCount + 1);
        }

        if (!putRes.ok) {
          const errData = await putRes.json().catch(() => ({}));
          throw new Error(errData.message || `HTTP ${putRes.status}`);
        }

        setSyncStatus('ok', 'Saved to data.json ✓');
        showToast('Saved to data.json successfully!');
      } catch (err) {
        console.error('Error saving data.json:', err);
        setSyncStatus('error', 'Save Error (Retained Locally)');
        showToast('data.json error: ' + err.message);
      } finally {
        isSaving = false;
        if (pendingSave) {
          pendingSave = false;
          syncToGitHub(0);
        }
      }
    }

    // --- CRUD OPERATIONS ---
    function handleSaveEntry(e) {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const city = document.getElementById('custCity').value.trim();
      const amount = parseFloat(document.getElementById('custAmount').value) || 0;
      const notes = document.getElementById('custNotes').value.trim();
      const date = document.getElementById('custDate').value || new Date().toISOString().slice(0, 10);

      if (!name || !phone) {
        showToast('Please enter both Name and Mobile Number');
        return;
      }

      if (editId) {
        const idx = entries.findIndex(item => String(item.id) === String(editId));
        if (idx > -1) {
          entries[idx] = { ...entries[idx], name, phone, city, amount, notes, date, updatedAt: Date.now() };
        }
      } else {
        entries.unshift({
          id: Date.now().toString(),
          name,
          phone,
          city,
          amount,
          notes,
          date,
          createdAt: Date.now()
        });
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      resetForm();
      renderList();
      syncToGitHub();
    }

    function editEntry(id) {
      const item = entries.find(x => String(x.id) === String(id));
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('custName').value = item.name || '';
      document.getElementById('custPhone').value = item.phone || '';
      document.getElementById('custCity').value = item.city || '';
      document.getElementById('custAmount').value = item.amount || '';
      document.getElementById('custNotes').value = item.notes || '';
      document.getElementById('custDate').value = item.date || new Date().toISOString().slice(0, 10);

      document.getElementById('formTitle').textContent = '✏️ Edit Customer Entry';
      document.getElementById('saveBtn').textContent = '💾 Update Entry';
      document.getElementById('cancelEditBtn').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(id) {
      if (!confirm('Delete this customer entry?')) return;
      entries = entries.filter(x => String(x.id) !== String(id));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      renderList();
      syncToGitHub();
    }

    function resetForm() {
      document.getElementById('entryForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('custDate').valueAsDate = new Date();
      document.getElementById('formTitle').textContent = '➕ Add Customer Entry';
      document.getElementById('saveBtn').textContent = '💾 Save Entry';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    // --- RENDER & SEARCH ---
    function renderList() {
      const listEl = document.getElementById('customerList');
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      const filtered = entries.filter(item => {
        return (
          (item.name || '').toLowerCase().includes(q) ||
          (item.phone || '').toLowerCase().includes(q) ||
          (item.city || '').toLowerCase().includes(q) ||
          (item.notes || '').toLowerCase().includes(q)
        );
      });

      // Update Summary Stats
      document.getElementById('statCount').textContent = entries.length;
      const totalAmt = entries.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      document.getElementById('statAmount').textContent = '₹' + totalAmt.toLocaleString('en-IN');

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No customer entries found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="customer-item">
          <div class="customer-info">
            <h3>${escapeHTML(item.name)}</h3>
            <div class="customer-meta">
              <span>📞 <a href="tel:${escapeHTML(item.phone)}" style="color:inherit;text-decoration:none;">${escapeHTML(item.phone)}</a></span>
              ${item.city ? `<span>📍 ${escapeHTML(item.city)}</span>` : ''}
              ${item.date ? `<span>📅 ${escapeHTML(item.date)}</span>` : ''}
              ${item.amount ? `<span class="badge badge-amount">₹${Number(item.amount).toLocaleString('en-IN')}</span>` : ''}
              ${item.notes ? `<span class="badge">${escapeHTML(item.notes)}</span>` : ''}
            </div>
          </div>
          <div class="customer-actions">
            <button class="btn btn-secondary btn-sm" onclick="editEntry('${escapeHTML(item.id)}')">✏️ Edit</button>
            <button class="btn btn-danger" onclick="deleteEntry('${escapeHTML(item.id)}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // --- SETTINGS MODAL & BACKUP ---
    function openSettings() {
      const cfg = getGHConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghPath').value = cfg.path;
      document.getElementById('ghToken').value = cfg.token;
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function saveSettings() {
      const cfg = {
        owner: document.getElementById('ghOwner').value.trim() || 'playtv02',
        repo: document.getElementById('ghRepo').value.trim() || 'Customer-directory',
        path: document.getElementById('ghPath').value.trim() || 'data.json',
        token: document.getElementById('ghToken').value.trim()
      };
      localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
      closeSettings();
      fetchFromGitHub(true);
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- INITIALIZE ---
    (function init() {
      try {
        const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(local)) entries = local;
      } catch (e) {
        entries = [];
      }
      renderList();
      fetchFromGitHub(false);
    })();
  </script>
</body>
</html>
