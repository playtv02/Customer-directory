<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customer directory for Kabir Emporium">
    <title>Kabir Emporium Directory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e2e8f0;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-highlight: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --focus-ring: rgba(37, 99, 235, 0.3);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 20px;
            --shadow-3d: 0 20px 35px -10px rgba(15, 23, 42, 0.12), 0 10px 15px -5px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            --shadow-card-hover: 0 30px 50px -15px rgba(15, 23, 42, 0.18), 0 15px 25px -5px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            --shadow-btn: 0 10px 20px -5px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            --transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            padding: 40px 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        input, button, textarea, select {
            font-family: inherit;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        /* Layout & 3D Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow-3d);
            margin-bottom: 28px;
            border: 1px solid var(--border);
            transform: translateY(0);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        /* Year Banner */
        .year-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            box-shadow: 0 15px 30px -8px rgba(15, 23, 42, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            letter-spacing: 0.03em;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #2563eb;
            margin: 0;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8), 0 2px 4px rgba(37, 99, 235, 0.15);
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 10px 16px;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-main);
            border: 1px solid var(--border);
            box-shadow: 0 6px 15px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            margin-left: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.active {
            background: var(--success);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }

        .status-dot.error {
            background: var(--danger);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .status-dot.syncing {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--surface);
            padding: 20px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-3d);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .stat-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 35px -10px rgba(15, 23, 42, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        @media (max-width: 480px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Year-Wise Breakdown Grid */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .year-card {
            background: var(--surface);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-3d);
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .year-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 35px -10px rgba(15, 23, 42, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .year-card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .year-card-total {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        .year-card-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Forms */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .form-control {
            width: 100%;
            padding: 15px 18px;
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            color: var(--text-main);
            transition: all var(--transition);
            outline: none;
            box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.03), 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--focus-ring), inset 0 1px 2px rgba(15, 23, 42, 0.02);
            transform: translateY(-1px);
        }

        /* 3D Tactile Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            box-shadow: var(--shadow-btn);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Records Header Section */
        .records-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .records-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
        }

        /* Search & List */
        .search-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .search-wrapper input {
            padding-left: 48px;
            border-radius: 99px;
            background: var(--surface);
            box-shadow: var(--shadow-3d);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }

        .showing-text {
            text-align: right;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: -12px;
            margin-bottom: 16px;
            padding-right: 8px;
            font-weight: 600;
        }

        .record-card {
            background: var(--surface);
            padding: 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-3d);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .record-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-name {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            color: #0f172a;
        }

        .badge {
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
        }

        .record-details {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 18px;
        }

        .record-calc {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .record-total {
            font-weight: 800;
            font-size: 1.3rem;
            color: #0f172a;
        }

        .btn-icon {
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 10px;
            transition: var(--transition);
            border-radius: 12px;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 8px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .btn-icon:hover {
            color: var(--danger);
            background: #fef2f2;
            border-color: #fecaca;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(239, 68, 68, 0.15);
        }

        /* Settings Area */
        .settings-panel {
            background: var(--surface);
            border: 1px solid var(--border);
