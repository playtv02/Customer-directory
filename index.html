<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer directory for Kabir Emporium">
  <title>Kabir Emporium Directory</title>
  <link rel="icon" href="book.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="book.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-grad: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #cbd5e1 100%);
      --surface-3d: linear-gradient(145deg, #ffffff, #f8fafc);
      --surface-hover-3d: linear-gradient(145deg, #ffffff, #f1f5f9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-highlight: rgba(255, 255, 255, 0.9);
      --border-shadow: rgba(203, 213, 225, 0.5);
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-depth: #1e3a8a;
      --danger: #ef4444;
      --danger-depth: #991b1b;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 20px;
      --focus-ring: rgba(37, 99, 235, 0.25);

      /* 3D Shadows */
      --shadow-3d: 
        8px 12px 20px rgba(15, 23, 42, 0.08),
        -4px -4px 12px rgba(255, 255, 255, 0.8),
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 6px rgba(15, 23, 42, 0.03);
      --shadow-3d-hover: 
        12px 18px 28px rgba(15, 23, 42, 0.12),
        -6px -6px 16px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 1),
        inset -2px -2px 6px rgba(15, 23, 42, 0.03);
      --shadow-3d-inset: 
        inset 3px 3px 6px rgba(15, 23, 42, 0.1),
        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
      --shadow-btn: 
        0 4px 6px -1px rgba(37, 99, 235, 0.2), 
        0 2px 4px -1px rgba(37, 99, 235, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Styling */
    header {
      background: var(--surface-3d);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.4);
    }

    .brand-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .brand-text p {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .add-btn {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: white;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 12px -2px rgba(37, 99, 235, 0.3);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    /* Search & Stats Bar */
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-wrapper {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border-radius: 16px;
      border: 1px solid var(--border-highlight);
      background: var(--surface-3d);
      box-shadow: var(--shadow-3d-inset);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    .search-input:focus {
      box-shadow: 0 0 0 3px var(--focus-ring), var(--shadow-3d-inset);
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* 3D Customer Cards */
    .card {
      background: var(--surface-3d);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-3d);
      border: 1px solid var(--border-highlight);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-3d-hover);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent);
      box-shadow: var(--shadow-3d-inset);
      font-size: 1.1rem;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-details {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-grow: 1;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid #e2e8f0;
      padding-top: 1rem;
    }

    .action-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      background: #e2e8f0;
      color: var(--text-main);
    }

    .action-btn:hover {
      background: #cbd5e1;
    }

    .action-btn.delete {
      color: var(--danger);
      background: #fee2e2;
    }

    .action-btn.delete:hover {
      background: #fca5a5;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--surface-3d);
      padding: 2rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow-3d-hover);
      border: 1px solid var(--border-highlight);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #cbd5e1;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      grid-column: 1 / -1;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-icon">📚</div>
        <div class="brand-text">
          <h1>Kabir Emporium</h1>
          <p>Customer Directory & Directory</p>
        </div>
      </div>
      <button class="add-btn" id="openModalBtn">
        <span>+</span> Add Customer
      </button>
    </header>

    <div class="controls">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, phone, or tags...">
      </div>
    </div>

    <div class="grid" id="customerGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Add New Customer</h2>
      <form id="customerForm">
        <input type="hidden" id="customerId">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="nameInput" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="phoneInput" class="form-input" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="emailInput" class="form-input">
        </div>
        <div class="form-group">
          <label>Notes / Address</label>
          <textarea id="notesInput" class="form-input" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="closeModalBtn">Cancel</button>
          <button type="submit" class="add-btn" style="padding: 0.6rem 1.2rem;">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial State & Local Storage Management
    const STORAGE_KEY = 'kabir_directory_customers';
    
    const initialCustomers = [
      { id: '1', name: 'Aarav Sharma', phone: '+91 98765 43210', email: 'aarav@example.com', notes: 'Regular buyer of textbooks.' },
      { id: '2', name: 'Priya Patel', phone: '+91 98765 12345', email: 'priya@example.com', notes: 'Wholesale order for stationery.' },
      { id: '3', name: 'Rahul Verma', phone: '+91 91234 56789', email: 'rahul@example.com', notes: 'Requested novel restocks.' }
    ];

    function getCustomers() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : initialCustomers;
    }

    function saveCustomers(customers) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
      render();
    }

    // DOM Elements
    const grid = document.getElementById('customerGrid');
    const searchInput = document.getElementById('searchInput');
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const customerForm = document.getElementById('customerForm');
    const modalTitle = document.getElementById('modalTitle');

    // Render Function
    function render(query = '') {
      const customers = getCustomers();
      const filtered = customers.filter(c => 
        c.name.toLowerCase().includes(query.toLowerCase()) ||
        c.phone.includes(query) ||
        (c.email && c.email.toLowerCase().includes(query.toLowerCase())) ||
        (c.notes && c.notes.toLowerCase().includes(query.toLowerCase()))
      );

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No customers found matching your query.</div>';
        return;
      }

      filtered.forEach(c => {
        const initials = c.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="avatar">${initials}</div>
            <div>
              <div class="card-title">${escapeHtml(c.name)}</div>
              <div class="card-subtitle">ID: #${c.id.substring(0, 6)}</div>
            </div>
          </div>
          <div class="card-details">
            <div class="detail-item">📞 ${escapeHtml(c.phone)}</div>
            ${c.email ? `<div class="detail-item">✉️ ${escapeHtml(c.email)}</div>` : ''}
            ${c.notes ? `<div class="detail-item">📝 ${escapeHtml(c.notes)}</div>` : ''}
          </div>
          <div class="card-actions">
            <button class="action-btn" onclick="editCustomer('${c.id}')">Edit</button>
            <button class="action-btn delete" onclick="deleteCustomer('${c.id}')">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Modal Control
    openModalBtn.addEventListener('click', () => {
      customerForm.reset();
      document.getElementById('customerId').value = '';
      modalTitle.textContent = 'Add New Customer';
      modalOverlay.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    // Form Submit
    customerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('customerId').value;
      const name = document.getElementById('nameInput').value;
      const phone = document.getElementById('phoneInput').value;
      const email = document.getElementById('emailInput').value;
      const notes = document.getElementById('notesInput').value;

      let customers = getCustomers();

      if (id) {
        // Edit
        customers = customers.map(c => c.id === id ? { id, name, phone, email, notes } : c);
      } else {
        // Create
        const newCust = {
          id: Date.now().toString(),
          name, phone, email, notes
        };
        customers.push(newCust);
      }

      saveCustomers(customers);
      modalOverlay.classList.remove('active');
    });

    // Edit/Delete Handlers
    window.editCustomer = function(id) {
      const c = getCustomers().find(item => item.id === id);
      if (!c) return;

      document.getElementById('customerId').value = c.id;
      document.getElementById('nameInput').value = c.name;
      document.getElementById('phoneInput').value = c.phone;
      document.getElementById('emailInput').value = c.email || '';
      document.getElementById('notesInput').value = c.notes || '';
      
      modalTitle.textContent = 'Edit Customer';
      modalOverlay.classList.add('active');
    };

    window.deleteCustomer = function(id) {
      if (confirm('Are you sure you want to delete this customer?')) {
        const customers = getCustomers().filter(c => c.id !== id);
        saveCustomers(customers);
      }
    };

    // Search Handler
    searchInput.addEventListener('input', (e) => {
      render(e.target.value);
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Initial Render
    render();
  </script>
</body>
</html>
