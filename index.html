<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customer directory for Kabir Emporium">
    <title>Kabir Emporium Directory</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-grad: radial-gradient(circle at 50% 0%, #f1f5f9 0%, #cbd5e1 100%);
            --surface-3d: linear-gradient(145deg, #ffffff, #f8fafc);
            --surface-hover-3d: linear-gradient(145deg, #ffffff, #f1f5f9);
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-highlight: rgba(255, 255, 255, 0.9);
            --border-shadow: rgba(203, 213, 225, 0.5);
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-depth: #1e3a8a;
            --danger: #ef4444;
            --danger-depth: #991b1b;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 20px;
            --focus-ring: rgba(37, 99, 235, 0.25);
            
            /* 3D Shadows */
            --shadow-3d: 8px 12px 20px rgba(15, 23, 42, 0.08), -4px -4px 12px rgba(255, 255, 255, 0.8), inset 2px 2px 4px rgba(255, 255, 255, 1), inset -2px -2px 6px rgba(15, 23, 42, 0.03);
            --shadow-3d-hover: 12px 18px 28px rgba(15, 23, 42, 0.12), -6px -6px 16px rgba(255, 255, 255, 0.9), inset 2px 2px 4px rgba(255, 255, 255, 1), inset -2px -2px 6px rgba(15, 23, 42, 0.04);
            --shadow-pressed: inset 4px 4px 8px rgba(15, 23, 42, 0.08), inset -4px -4px 8px rgba(255, 255, 255, 0.9), 0 2px 2px rgba(255, 255, 255, 0.6);
            
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-spring: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background: var(--bg-grad);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            box-sizing: border-box;
        }

        /* Order Card UI */
        .order-card {
            background: var(--surface-3d);
            box-shadow: var(--shadow-3d);
            border-radius: var(--radius);
            padding: 24px;
            margin: 20px auto;
            max-width: 600px;
        }

        .order-card h2 {
            margin-top: 0;
            color: var(--text-main);
            font-weight: 700;
        }

        /* Inputs */
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--surface-3d);
            box-shadow: var(--shadow-pressed);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition-smooth);
            box-sizing: border-box;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring), var(--shadow-pressed);
        }

        /* Item Rows */
        .item-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }

        .item-row input.item-name {
            flex: 2;
        }

        .item-row input.item-price {
            flex: 1;
        }

        /* Buttons */
        .btn {
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-3d);
            color: white;
            font-size: 1rem;
        }

        .btn:active {
            box-shadow: var(--shadow-pressed);
            transform: scale(0.98);
        }

        .btn-add {
            background: var(--accent);
            width: 100%;
            margin-top: 8px;
        }

        .btn-add:hover {
            background: var(--accent-hover);
        }

        .btn-remove {
            background: var(--surface-3d);
            color: var(--danger);
            padding: 14px 18px;
            font-size: 1.1rem;
        }

        .btn-remove:hover {
            color: var(--danger-depth);
        }

        /* Total Summary */
        .order-summary {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .total-amount {
            color: var(--success);
        }
    </style>
</head>
<body>

    <div class="order-card">
        <h2>Customer Order</h2>
        
        <!-- Customer Details -->
        <div style="margin-bottom: 32px;">
            <input type="text" placeholder="Customer Name (e.g. Rahul Kumar)">
        </div>

        <!-- Dynamic Items Container -->
        <div id="items-container">
            <!-- First Item Row -->
            <div class="item-row">
                <input type="text" placeholder="Item Name" class="item-name">
                <input type="number" placeholder="Price (₹)" class="item-price" oninput="calculateTotal()" min="0">
                <button class="btn btn-remove" onclick="removeItem(this)" title="Remove Item">✕</button>
            </div>
        </div>

        <!-- Add Item Button -->
        <button class="btn btn-add" onclick="addItem()">+ Add Another Item</button>

        <!-- Total Calculation -->
        <div class="order-summary">
            <span>Grand Total</span>
            <span class="total-amount">₹<span id="grand-total">0.00</span></span>
        </div>
    </div>

    <!-- Logic for dynamic items and calculation -->
    <script>
        function addItem() {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row';
            
            row.innerHTML = `
                <input type="text" placeholder="Item Name" class="item-name">
                <input type="number" placeholder="Price (₹)" class="item-price" oninput="calculateTotal()" min="0">
                <button class="btn btn-remove" onclick="removeItem(this)" title="Remove Item">✕</button>
            `;
            
            container.appendChild(row);
        }

        function removeItem(buttonElement) {
            const container = document.getElementById('items-container');
            
            // If it's the only row left, clear inputs instead of removing
            if (container.children.length === 1) {
                const inputs = buttonElement.parentElement.querySelectorAll('input');
                inputs.forEach(input => input.value = '');
            } else {
                buttonElement.parentElement.remove();
            }
            
            calculateTotal(); // Update total after removal/clearing
        }

        function calculateTotal() {
            const priceInputs = document.querySelectorAll('.item-price');
            let total = 0;
            
            priceInputs.forEach(input => {
                const price = parseFloat(input.value);
                if (!isNaN(price) && price > 0) {
                    total += price;
                }
            });
            
            // Format to 2 decimal places
            document.getElementById('grand-total').innerText = total.toFixed(2);
        }
    </script>
</body>
</html>
