<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Customer directory for Kabir Emporium">
    <title>Kabir Emporium Directory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <div class="logo-text">
                    <h2>Kabir Emporium</h2>
                    <span class="logo-subtitle">Directory System</span>
                </div>
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="customers">
                    <span class="nav-icon">👥</span>
                    <span>Customers</span>
                </a>
                <a href="#" class="nav-item" data-tab="analytics">
                    <span class="nav-icon">📈</span>
                    <span>Analytics</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">AD</div>
                    <div class="user-details">
                        <span class="user-name">Admin</span>
                        <span class="user-role">System Administrator</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="header">
                <div class="header-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search customers by name, email, or company...">
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" id="exportBtn">
                        <span>📥</span> Export CSV
                    </button>
                    <button class="btn btn-primary" id="addCustomerBtn">
                        <span>➕</span> Add Customer
                    </button>
                </div>
            </header>

            <!-- Tab Content: Customers -->
            <div class="tab-content active" id="customersTab">
                <!-- Stats Bar -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon blue">👥</div>
                        <div class="stat-data">
                            <span class="stat-value" id="totalCustomersCount">0</span>
                            <span class="stat-label">Total Customers</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">✅</div>
                        <div class="stat-data">
                            <span class="stat-value" id="activeCustomersCount">0</span>
                            <span class="stat-label">Active Status</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">💎</div>
                        <div class="stat-data">
                            <span class="stat-value" id="vipCustomersCount">0</span>
                            <span class="stat-label">VIP Tier</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange">💰</div>
                        <div class="stat-data">
                            <span class="stat-value" id="totalRevenueCount">$0</span>
                            <span class="stat-label">Total Revenue</span>
                        </div>
                    </div>
                </div>

                <!-- Filter & Control Bar -->
                <div class="controls-bar">
                    <div class="filter-group">
                        <select id="statusFilter" class="select-input">
                            <option value="all">All Statuses</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Pending">Pending</option>
                        </select>
                        <select id="tierFilter" class="select-input">
                            <option value="all">All Tiers</option>
                            <option value="VIP">VIP</option>
                            <option value="Premium">Premium</option>
                            <option value="Standard">Standard</option>
                            <option value="Basic">Basic</option>
                        </select>
                        <select id="sortBy" class="select-input">
                            <option value="name">Sort by Name</option>
                            <option value="company">Sort by Company</option>
                            <option value="spent">Sort by Total Spent</option>
                            <option value="date">Sort by Join Date</option>
                        </select>
                    </div>
                    <div class="view-toggle">
                        <button class="toggle-btn active" data-view="table" title="Table View">📋</button>
                        <button class="toggle-btn" data-view="grid" title="Grid View">🔲</button>
                    </div>
                </div>

                <!-- Directory Container (Table & Grid views rendered by JS) -->
                <div id="directoryView" class="directory-container view-table">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Tab Content: Analytics -->
            <div class="tab-content" id="analyticsTab">
                <div class="analytics-header">
                    <h2>Directory Analytics & Insights</h2>
                </div>
                <div class="analytics-grid">
                    <div class="analytics-card">
                        <h3>Tier Distribution</h3>
                        <div class="chart-placeholder" id="tierChart"></div>
                    </div>
                    <div class="analytics-card">
                        <h3>Status Breakdown</h3>
                        <div class="chart-placeholder" id="statusChart"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div class="modal" id="customerModal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Customer</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="custName">Full Name *</label>
                        <input type="text" id="custName" required placeholder="e.g. Jane Doe">
                    </div>
                    <div class="form-group">
                        <label for="custEmail">Email Address *</label>
                        <input type="email" id="custEmail" required placeholder="e.g. jane@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="custPhone">Phone Number</label>
                        <input type="tel" id="custPhone" placeholder="e.g. +1 555-0199">
                    </div>
                    <div class="form-group">
                        <label for="custCompany">Company</label>
                        <input type="text" id="custCompany" placeholder="e.g. Acme Corp">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="custStatus">Status</label>
                        <select id="custStatus">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Pending">Pending</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="custTier">Tier</label>
                        <select id="custTier">
                            <option value="Standard">Standard</option>
                            <option value="VIP">VIP</option>
                            <option value="Premium">Premium</option>
                            <option value="Basic">Basic</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="custSpent">Total Spent ($)</label>
                    <input type="number" id="custSpent" min="0" step="0.01" placeholder="0.00">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCustomerBtn">Save Customer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
