<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Customer directory for Kabir Emporium">
  <title>Kabir Emporium Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="container">
  <!-- Brand Header Card -->
  <div class="card-3d brand-header-card">
    <span class="shubh-labh-left"><span class="om-symbol">ॐ</span> शुभ</span>
    <span class="shubh-labh-right">लाभ <span class="swastik-symbol">卐</span></span>

    <div class="brand-info">
      <h1 class="brand-title">📘 Kabir Emporium</h1>
      <span class="brand-subtitle">Customer & Sales Directory System</span>
    </div>

    <!-- Pill Container for forced same-line layout -->
    <div class="header-pills-row">
      <div class="sync-pill" onclick="toggleSettingsPanel()" title="Click to configure GitHub Token">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>

      <div id="bank-holiday-pill" class="bank-status-pill">
        <span id="bank-status-icon">🏦</span>
        <span id="bank-status-text">Checking Bank Status...</span>
      </div>
    </div>
  </div>

  <!-- GitHub Settings Panel -->
  <div id="settings-panel" class="card-3d card settings-panel form-card-static" style="display: none;">
    <h3 class="settings-heading">☁️ GitHub Cloud Connection</h3>
    <p>Enter your GitHub Token to load and save records directly from your cloud repository.</p>
    <div class="form-group" style="margin-bottom: 20px;">
      <input type="password" id="gh-token" class="form-control" placeholder="🔑 e.g. ghp_xxxxxxxxxxxx">
    </div>
    <button type="button" class="btn btn-primary" onclick="saveToken()">🔗 Connect</button>
  </div>
