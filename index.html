<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabir Emporium - Customer Directory</title>
    <!-- Connect your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>Kabir Emporium Customer Directory</h1>
            <p>Manage customer sales transactions, pricing, and records.</p>
        </div>
    </header>

    <main class="main-container">
        <!-- Holiday Banner -->
        <div id="holiday-banner" class="holiday-banner" style="display: none;"></div>

        <!-- Dashboard Stats -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Total Customers</h3>
                <p id="totalCustomersCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Active</h3>
                <p id="activeCustomersCount">0</p>
            </div>
            <div class="stat-card">
                <h3>VIP Tier</h3>
                <p id="vipCustomersCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <p id="totalRevenueCount">$0.00</p>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="toolbar">
            <div class="search-filter-group">
                <input type="text" id="searchInput" placeholder="Search by name, email, or company..." class="search-input">
                
                <select id="statusFilter" class="filter-select">
                    <option value="all">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <select id="tierFilter" class="filter-select">
                    <option value="all">All Tiers</option>
                    <option value="Standard">Standard</option>
                    <option value="VIP">VIP</option>
                </select>

                <select id="sortBy" class="filter-select">
                    <option value="name">Sort by Name</option>
                    <option value="company">Sort by Company</option>
                    <option value="spent">Sort by Total Spent</option>
                    <option value="date">Sort by Date</option>
                </select>
            </div>

            <div class="action-buttons">
                <button id="addCustomerBtn" class="btn btn-primary">+ Add Customer</button>
                <button id="exportBtn" class="btn btn-secondary">Export CSV</button>
            </div>
        </div>

        <!-- View Toggles -->
        <div class="view-toggles">
            <button class="toggle-btn active" data-view="table">Table View</button>
            <button class="toggle-btn" data-view="grid">Card View</button>
        </div>

        <!-- Directory Container -->
        <div id="directoryView" class="directory-container view-table">
            <!-- Dynamically populated by script.js -->
        </div>

        <!-- Analytics Section -->
        <div class="analytics-section">
            <div class="analytics-card">
                <h3>Tier Breakdown</h3>
                <div id="tierChart"></div>
            </div>
            <div class="analytics-card">
                <h3>Status Breakdown</h3>
                <div id="statusChart"></div>
            </div>
        </div>
    </main>

    <!-- Customer Modal -->
    <div id="customerModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Customer</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                
                <div class="form-group">
                    <label for="custName">Full Name *</label>
                    <input type="text" id="custName" required>
                </div>

                <div class="form-group">
                    <label for="custEmail">Email *</label>
                    <input type="email" id="custEmail" required>
                </div>

                <div class="form-group">
                    <label for="custPhone">Phone Number</label>
                    <input type="tel" id="custPhone">
                </div>

                <div class="form-group">
                    <label for="custCompany">Company</label>
                    <input type="text" id="custCompany">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="custStatus">Status</label>
                        <select id="custStatus">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="custTier">Tier</label>
                        <select id="custTier">
                            <option value="Standard">Standard</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="custSpent">Total Spent ($)</label>
                        <input type="number" step="0.01" id="custSpent" value="0">
                    </div>

                    <div class="form-group">
                        <label for="cust-date">Date</label>
                        <input type="date" id="cust-date">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancelModalBtn" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Customer</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="app-footer">
        <p>&copy; <span id="banner-year">2026</span> Kabir Emporium. All rights reserved.</p>
    </footer>

    <!-- Connect your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
